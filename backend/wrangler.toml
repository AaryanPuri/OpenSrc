# Cloudflare Worker for the OpenSrc API (/api/*). The site itself is on Cloudflare Pages;
# this Worker answers only opensrc.studio/api/*. See docs/deploy.md.
#
# Deploy from backend/:   npx wrangler deploy
# Secrets (once each):    npx wrangler secret put GITHUB_TOKEN
#                         npx wrangler secret put ANTHROPIC_API_KEY   (optional)
#
# Optional login, synced saves and newsletter (docs/deploy.md, section 3). Each stays off (503) until set:
#   npx wrangler secret put DATABASE_URL                 libsql://<db>.turso.io
#   npx wrangler secret put DATABASE_AUTH_TOKEN
#   npx wrangler secret put GITHUB_OAUTH_CLIENT_ID
#   npx wrangler secret put GITHUB_OAUTH_CLIENT_SECRET
#   npx wrangler secret put SESSION_SECRET
#   npx wrangler secret put NEWSLETTER_SECRET
#   npx wrangler secret put RESEND_API_KEY
#   npx wrangler secret put NEWSLETTER_FROM              OpenSrc <digest@opensrc.studio>

name = "opensrc-api"
main = "src/app.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Also reachable at https://opensrc-api.<your-subdomain>.workers.dev for testing.
workers_dev = true

routes = [
  { pattern = "opensrc.studio/api/*", zone_name = "opensrc.studio" },
]

# The public origin: OAuth callback, links in emails, and the Origin allowed to make writes.
[vars]
SITE_URL = "https://opensrc.studio"

[observability]
enabled = true
