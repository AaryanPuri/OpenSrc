name: CI

on:
  push:
  pull_request:
  # Lets the nightly data job (collect.yml) start CI on its PR branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install (root tooling)
        run: npm ci

      - name: Install (frontend)
        run: npm ci
        working-directory: frontend

      - name: Install (backend)
        run: npm ci
        working-directory: backend

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate repo dataset (data/)
        run: npm --prefix backend run validate-data

      - name: Test (frontend + shared parser, then backend)
        run: npm test

      - name: Build (frontend with pre-rendering, then backend)
        run: npm run build
        env:
          SITE_URL: https://opensrc.studio
          CI_REQUIRE_SITE_URL: '1'

      - name: Pre-render smoke test (fixture dataset, hydration in jsdom)
        run: npm --prefix frontend run test:prerender
        env:
          SITE_URL: https://opensrc.studio

  e2e:
    name: End-to-end (Playwright, Chromium)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install
        run: npm ci && npm --prefix frontend ci && npm --prefix backend ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Also installs Chromium's system libraries (the browser itself comes from the cache when it hits).
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build (frontend with pre-rendering, then backend)
        run: npm run build
        env:
          SITE_URL: https://opensrc.studio

      - name: End-to-end tests (fixture dataset, production server)
        run: npm run e2e

      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
