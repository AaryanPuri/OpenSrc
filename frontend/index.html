<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>OpenSrc: stitch yourself into open source</title>
    <meta
      name="description"
      content="OpenSrc turns a plain-language wish, like a language, a field or how much time you have, into a GitHub search for open, unclaimed issues you can pick up."
    />
    <meta property="og:title" content="OpenSrc: stitch yourself into open source" />
    <meta
      property="og:description"
      content="Describe the open-source work you want in plain words and find unclaimed GitHub issues that fit."
    />
    <meta property="og:type" content="website" />
    <meta name="application-name" content="OpenSrc" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#1b1930" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5eee1" media="(prefers-color-scheme: light)" />
    <script>
      // Apply the persisted theme before first paint (also reads the pre-rename key).
      try {
        var raw = localStorage.getItem('ocf:theme') || localStorage.getItem('opensrc:theme') || '';
        var t = raw.replace(/"/g, '');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
