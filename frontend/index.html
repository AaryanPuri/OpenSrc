<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--head-->
    <meta name="application-name" content="OpenSrc" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PNG fallbacks: search engines want at least 48px (a multiple of 48) -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#1b1930" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5eee1" media="(prefers-color-scheme: light)" />
    <script>
      // Apply the persisted theme before first paint (also reads the pre-rename key).
      try {
        var raw = localStorage.getItem('ocf:theme') || localStorage.getItem('opensrc:theme') || '';
        var t = raw.replace(/"/g, '');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
